<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">BoneVibAuth project overview</title>
  <desc id="desc">A conceptual diagram of implicit authentication using bone-conduction head-vibration feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315f8a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d3852" flood-opacity=".13"/></filter>
    <style>
      .serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Arial,"Microsoft YaHei",sans-serif}
      .ink{fill:#252a31}.muted{fill:#68737d}.blue{fill:#315f8a}.red{fill:#7b1725}.gold{fill:#aa6b14}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#f7fafc"/>
  <path d="M0 795C220 730 315 850 540 790S940 725 1200 800" fill="none" stroke="#d6e0e8" stroke-width="2" stroke-dasharray="2 12"/>
  <path d="M1030 0c45 42 95 35 170 82" fill="none" stroke="#b9cfdf" stroke-width="2"/>
  <text x="58" y="78" class="serif blue" font-size="58" font-weight="700">BoneVibAuth</text>
  <text x="61" y="118" class="serif ink" font-size="25">Implicit identity authentication from head-vibration feedback</text>
  <path d="M61 146h180" stroke="#315f8a" stroke-width="5"/>
  <path d="M252 146h70" stroke="#b9cfdf" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="58" y="205" width="330" height="485" rx="22" fill="#fff" stroke="#c8d6e0" stroke-width="2"/>
  </g>
  <text x="92" y="258" class="serif blue" font-size="27" font-weight="700">1  Wearable sensing</text>
  <text x="92" y="291" class="sans muted" font-size="18">Low-interference chirp probing</text>
  <circle cx="222" cy="468" r="126" fill="#edf4f8" stroke="#a9c0cf" stroke-width="3"/>
  <path d="M183 558c-27-45-34-101-16-145 15-36 53-61 91-57 33 3 57 22 72 51 16 31 14 65 2 93-12 28-30 45-54 57l-5 44h-71z" fill="#fff9f4" stroke="#315f8a" stroke-width="4"/>
  <path d="M255 409c-24 0-42 19-42 44s18 45 42 45c18 0 31-12 31-29 0-14-9-24-22-24-8 0-14 5-17 12" fill="none" stroke="#7b1725" stroke-width="7" stroke-linecap="round"/>
  <path d="M116 406c-34 25-34 72 0 96M92 383c-56 42-56 114 0 156" fill="none" stroke="#315f8a" stroke-width="4" stroke-linecap="round"/>
  <text x="222" y="636" text-anchor="middle" class="sans blue" font-size="19" font-weight="700">head impedance + structural asymmetry</text>

  <path d="M405 448h65" fill="none" stroke="#315f8a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="408" y="423" class="sans muted" font-size="16">vibration response</text>

  <g filter="url(#shadow)">
    <rect x="470" y="205" width="670" height="485" rx="22" fill="#fff" stroke="#c8d6e0" stroke-width="2"/>
  </g>
  <text x="510" y="258" class="serif blue" font-size="27" font-weight="700">2  Authentication pipeline</text>
  <text x="510" y="291" class="sans muted" font-size="18">From personal vibration signatures to adaptive verification</text>

  <rect x="510" y="345" width="245" height="105" rx="16" fill="#eef5f9" stroke="#a9c0cf" stroke-width="2"/>
  <text x="632" y="383" text-anchor="middle" class="sans blue" font-size="21" font-weight="700">Feature encoder</text>
  <text x="632" y="417" text-anchor="middle" class="sans muted" font-size="17">time-frequency response</text>
  <path d="M765 398h55" fill="none" stroke="#315f8a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="820" y="345" width="275" height="105" rx="16" fill="#fff5e7" stroke="#dfbb7a" stroke-width="2"/>
  <text x="957" y="383" text-anchor="middle" class="sans gold" font-size="21" font-weight="700">Siamese verifier</text>
  <text x="957" y="417" text-anchor="middle" class="sans muted" font-size="17">compare enrolled identity</text>

  <path d="M632 450v52M957 450v52" fill="none" stroke="#315f8a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="555" y="520" width="205" height="104" rx="16" fill="#eef8f1" stroke="#afd0b8" stroke-width="2"/>
  <text x="657" y="559" text-anchor="middle" class="sans" fill="#22643c" font-size="22" font-weight="700">MATCH</text>
  <text x="657" y="594" text-anchor="middle" class="sans muted" font-size="17">authenticated user</text>
  <rect x="855" y="520" width="205" height="104" rx="16" fill="#fff0ed" stroke="#d6a1a4" stroke-width="2"/>
  <text x="957" y="559" text-anchor="middle" class="sans red" font-size="22" font-weight="700">REJECT</text>
  <text x="957" y="594" text-anchor="middle" class="sans muted" font-size="17">impostor or drift</text>

  <path d="M760 572h90" fill="none" stroke="#7b1725" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="805" y="558" text-anchor="middle" class="sans red" font-size="15">adaptive update</text>
  <path d="M555 654c120 32 365 32 505 0" fill="none" stroke="#d7e1e8" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="600" y="735" class="serif blue" font-size="26" font-style="italic">Authenticate implicitly.</text>
  <text x="600" y="770" class="sans muted" font-size="18">Low interference · lightweight transfer · adaptive security</text>
  <text x="1140" y="842" text-anchor="end" class="sans muted" font-size="15">Mingyu Ma · AI Security</text>
</svg>
