<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Network Security project overview</title>
  <desc id="desc">A conceptual diagram of network traffic monitoring, anomaly detection, and policy response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315f8a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183d59" flood-opacity=".13"/></filter>
    <style>
      .serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Arial,"Microsoft YaHei",sans-serif}
      .ink{fill:#252a31}.muted{fill:#6d7780}.blue{fill:#315f8a}.red{fill:#7b1725}.gold{fill:#aa6b14}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#f6fafc"/>
  <path d="M0 798C220 730 340 850 560 790S970 730 1200 802" fill="none" stroke="#d7e2e9" stroke-width="2" stroke-dasharray="2 12"/>
  <path d="M1035 0c50 44 105 37 165 82" fill="none" stroke="#b8cfdf" stroke-width="2"/>
  <text x="58" y="78" class="serif blue" font-size="58" font-weight="700">Network Security</text>
  <text x="61" y="119" class="serif ink" font-size="25">Security-oriented systems and engineering practice</text>
  <path d="M61 146h180" stroke="#315f8a" stroke-width="5"/>
  <path d="M252 146h70" stroke="#b9cfdf" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="58" y="215" width="300" height="465" rx="22" fill="#fff" stroke="#c7d8e2" stroke-width="2"/>
  </g>
  <text x="92" y="267" class="serif blue" font-size="27" font-weight="700">1  Connected systems</text>
  <text x="92" y="300" class="sans muted" font-size="18">Observe traffic across a changing network</text>
  <g stroke="#9db7c9" stroke-width="3">
    <path d="M124 440l78-74 91 50-46 101-104-22z"/>
    <path d="M202 366l45 151M124 440l169-24M202 366l-59 129M293 416l-90 99"/>
  </g>
  <circle cx="124" cy="440" r="18" fill="#315f8a"/><circle cx="202" cy="366" r="18" fill="#aa6b14"/>
  <circle cx="293" cy="416" r="18" fill="#315f8a"/><circle cx="247" cy="517" r="18" fill="#7b1725"/>
  <circle cx="143" cy="493" r="18" fill="#315f8a"/>
  <path d="M103 585h189" stroke="#315f8a" stroke-width="4" stroke-dasharray="5 8"/>
  <text x="198" y="630" text-anchor="middle" class="sans blue" font-size="19" font-weight="700">packets · identities · events</text>

  <path d="M380 445h55" fill="none" stroke="#315f8a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="385" y="420" class="sans muted" font-size="16">monitor</text>

  <g filter="url(#shadow)">
    <rect x="435" y="215" width="705" height="465" rx="22" fill="#fff" stroke="#c7d8e2" stroke-width="2"/>
  </g>
  <text x="476" y="267" class="serif blue" font-size="27" font-weight="700">2  Detect, reason, respond</text>
  <text x="476" y="300" class="sans muted" font-size="18">Turn raw network activity into security decisions</text>

  <rect x="480" y="354" width="180" height="122" rx="16" fill="#eef5f9" stroke="#a9c0cf" stroke-width="2"/>
  <text x="570" y="394" text-anchor="middle" class="sans blue" font-size="21" font-weight="700">Traffic</text>
  <text x="570" y="423" text-anchor="middle" class="sans blue" font-size="21" font-weight="700">monitoring</text>
  <text x="570" y="451" text-anchor="middle" class="sans muted" font-size="16">collect + normalize</text>
  <path d="M660 415h36" fill="none" stroke="#315f8a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="700" y="354" width="190" height="122" rx="16" fill="#fff5e7" stroke="#dfbb7a" stroke-width="2"/>
  <text x="795" y="394" text-anchor="middle" class="sans gold" font-size="21" font-weight="700">Anomaly</text>
  <text x="795" y="423" text-anchor="middle" class="sans gold" font-size="21" font-weight="700">detection</text>
  <text x="795" y="451" text-anchor="middle" class="sans muted" font-size="16">risk-aware analysis</text>
  <path d="M890 415h36" fill="none" stroke="#315f8a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="930" y="354" width="170" height="122" rx="16" fill="#f8edf0" stroke="#d6a1a4" stroke-width="2"/>
  <text x="1015" y="394" text-anchor="middle" class="sans red" font-size="21" font-weight="700">Policy</text>
  <text x="1015" y="423" text-anchor="middle" class="sans red" font-size="21" font-weight="700">response</text>
  <text x="1015" y="451" text-anchor="middle" class="sans muted" font-size="16">alert · isolate · defend</text>

  <path d="M570 476v52M795 476v52M1015 476v52" fill="none" stroke="#315f8a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="535" y="550" width="500" height="72" rx="15" fill="#f1f7f4" stroke="#b8d2c4" stroke-width="2"/>
  <path d="M580 586h28M594 572v28" stroke="#2c7650" stroke-width="6" stroke-linecap="round"/>
  <text x="650" y="583" class="serif" fill="#2c7650" font-size="23" font-weight="700">Resilient security workflow</text>
  <text x="650" y="608" class="sans muted" font-size="16">analysis that supports practical engineering decisions</text>

  <text x="85" y="748" class="serif blue" font-size="27" font-style="italic">From traffic to trustworthy action.</text>
  <text x="85" y="783" class="sans muted" font-size="18">Systems thinking · security analysis · collaborative implementation</text>
  <text x="1140" y="842" text-anchor="end" class="sans muted" font-size="15">Mingyu Ma · Network Security</text>
</svg>
